# NCCL config file (NCCL_CONF_FILE) for experiments/ll_threads.sbatch: ring LL thread threshold 0, so NCCL never
# halves the thread count of Ring/LL (src/enqueue.cc, topoGetAlgoInfo). Order: tree LL LL128 Simple, ring LL LL128
# Simple; -1 keeps the default. In a file because the value has spaces (VARIANT_ENV is word-split)
NCCL_THREAD_THRESHOLDS=-1 -1 -1 0 -1 -1
